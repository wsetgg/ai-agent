name: PR Checks

on:
  pull_request:
    branches: ['*']

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync latest PR branch
        run: |
          git fetch origin "${{ github.head_ref }}"
          git reset --hard "origin/${{ github.head_ref }}"

      - name: Format the eight failing files
        run: pnpm exec prettier --write "app/api/auth/github/callback/route.ts" "app/api/github/repos/route.ts" "app/layout.tsx" "components/task-details.tsx" "components/task-form.tsx" "lib/sandbox/agents/claude.ts" "lib/sandbox/creation.ts" "lib/utils/branch-name-generator.ts"

      - name: Commit formatting-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/api/auth/github/callback/route.ts" "app/api/github/repos/route.ts" "app/layout.tsx" "components/task-details.tsx" "components/task-form.tsx" "lib/sandbox/agents/claude.ts" "lib/sandbox/creation.ts" "lib/utils/branch-name-generator.ts"
          if ! git diff --cached --quiet; then
            git commit -m "chore: format files for PR checks"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run lint
        run: pnpm lint

      - name: Run format check
        run: pnpm format:check

      - name: Run build
        run: pnpm build
