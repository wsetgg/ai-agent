name: Refresh Sandbox SDK lockfile

on:
  push:
    branches:
      - chore/upgrade-vercel-sandbox-sdk

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/upgrade-vercel-sandbox-sdk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate pnpm lockfile for sandbox SDK"
            git push
          fi
          rm .github/workflows/refresh-sandbox-lock.yml
          git add .github/workflows/refresh-sandbox-lock.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary lockfile workflow"
            git push
          fi
